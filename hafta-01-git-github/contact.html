<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İletişim</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>İletişim Formu</h1>
        <form action="#" method="post">
            <p>Bana ulaşmak için aşağıdaki formu doldurabilirsiniz:</p>
            <label for="name">Adınız:</label><br>
            <input type="text" id="name" name="name" style="width: 100%; padding: 8px; margin-bottom: 15px;"><br>
            
            <label for="message">Mesajınız:</label><br>
            <textarea id="message" name="message" rows="5" style="width: 100%; padding: 8px; margin-bottom: 15px;"></textarea><br>
            
            <button type="submit" style="padding: 10px 20px; background-color: #3498db; color: white; border: none; border-radius: 5px; cursor: pointer;">Gönder</button>
        </form>
    </div>
</body>
</html>
